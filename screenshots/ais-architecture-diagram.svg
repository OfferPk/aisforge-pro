  <rect x="790" y="460" width="220" height="40" rx="4" fill="#050d1a" stroke="#1c3866" stroke-width="1"/>
  <text x="900" y="485" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Ghost Vessel Trajectory Correlator</text>

