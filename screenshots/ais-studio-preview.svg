  <text x="80" y="42" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#f0f6fc">AISForge <tspan fill="#00f0ff">Pro</tspan></text>
  <text x="235" y="42" font-family="monospace" font-size="12" fill="#8b9eb8">v1.0.0 | ITU-R M.1371-5 &amp; NMEA 0183/2000 Maritime Navigation Studio</text>
  
